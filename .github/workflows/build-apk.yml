name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0

      - name: Fix gradlew line endings
        run: sed -i 's/\r$//' gradlew && chmod +x gradlew

      - name: Show Compose UI jar contents for Modifier
        run: |
          ./gradlew :app:dependencies --configuration debugCompileClasspath > deps.txt || true
          grep -i "compose.ui" deps.txt | head -50
          find ~/.gradle/caches -name "ui-*.jar" 2>/dev/null | head -20
          JAR=$(find ~/.gradle/caches -path "*compose/ui/ui/*" -name "ui-*.jar" ! -name "*sources*" ! -name "*javadoc*" 2>/dev/null | head -1)
          echo "JAR=$JAR"
          if [ -n "$JAR" ]; then jar tf "$JAR" | grep -i "modifier/Modifier" | head; fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MsgLayer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error